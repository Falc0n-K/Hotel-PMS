name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  qualite:
    name: Typage et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Typage TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build

  base-de-donnees:
    name: Migrations et tests SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Isolation entre hôtels, rôles, anti-surbooking, solde au départ,
      # numérotation des factures : un échec ici bloque le merge.
      - name: Tests de la base
        run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  fonctions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typage
        run: deno check --config deno.json */index.ts
      - name: Tests
        run: deno test --config deno.json _shared/

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: npm audit, dépendances livrées (high + critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, outillage (informatif)
        continue-on-error: true
        run: npm audit --audit-level=high

  version:
    name: Version et CHANGELOG
    # Seulement pour les PR vers main (release/* et hotfix/*) : la version doit être nouvelle
    # et décrite dans le CHANGELOG, sinon la release automatique n'aurait rien à publier.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version nouvelle, supérieure et décrite dans le CHANGELOG
        run: node scripts/check-version.mjs
