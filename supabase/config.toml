# Configuration Supabase CLI (déploiement des fonctions depuis la CI).
project_id = "gqbztdprvqwewivzebsa"

# Appelée par pg_cron avec x-cron-secret, pas par un utilisateur.
[functions.send-notifications]
verify_jwt = false

# Appelée depuis l'application avec le jeton de l'utilisateur.
[functions.create-payment-link]
verify_jwt = true

# Appelées par Stripe et PayDunya : authentifiées par signature, pas par JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.paydunya-ipn]
verify_jwt = false

# Distribution : appelées sans session, authentifiées autrement
# (captcha et limitation de débit, clé d'API, jeton iCal, secret de tâche).
[functions.public-booking]
verify_jwt = false

[functions.api]
verify_jwt = false

[functions.deliver-webhooks]
verify_jwt = false

[functions.ical]
verify_jwt = false

[functions.ical-sync]
verify_jwt = false
